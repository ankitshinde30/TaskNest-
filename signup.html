<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskNest – Create Account</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">🪺</div>
        <span class="auth-logo-text">TaskNest</span>
      </div>

      <!-- Step Progress -->
      <div class="step-progress">
        <div class="step-dot active" id="stepDot1">1</div>
        <div class="step-line" id="stepLine1"></div>
        <div class="step-dot" id="stepDot2">2</div>
        <div class="step-line" id="stepLine2"></div>
        <div class="step-dot" id="stepDot3">3</div>
      </div>

      <!-- ---- STEP 1: Identity ---- -->
      <div class="form-step active" id="step1">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Let's start with your name and email</p>

        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="signupName"
              class="auth-input"
              placeholder="John Doe"
              autocomplete="name"
            />
          </div>
          <div class="input-error" id="nameError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="signupEmail"
              class="auth-input"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
          <div class="input-error" id="emailError"></div>
        </div>

        <button class="auth-btn auth-btn-primary" onclick="nextStep()">
          Continue →
        </button>
      </div>

      <!-- ---- STEP 2: Password ---- -->
      <div class="form-step" id="step2">
        <h1 class="auth-title">Set password</h1>
        <p class="auth-subtitle">Create a strong password for your account</p>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="signupPassword"
              class="auth-input"
              placeholder="Min. 6 characters"
              oninput="checkPasswordStrength()"
              autocomplete="new-password"
            />
            <button
              class="toggle-password"
              id="toggleSignupPass"
              type="button"
              onclick="togglePasswordVisibility('signupPassword', 'toggleSignupPass')"
            >👁</button>
          </div>
          <div class="strength-bar">
            <div class="strength-segment" id="seg1"></div>
            <div class="strength-segment" id="seg2"></div>
            <div class="strength-segment" id="seg3"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
          <div class="input-error" id="passError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupConfirm">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input
              type="password"
              id="signupConfirm"
              class="auth-input"
              placeholder="Repeat your password"
              autocomplete="new-password"
            />
          </div>
          <div class="input-error" id="confirmError"></div>
        </div>

        <div class="auth-btn-row">
          <button class="auth-btn auth-btn-secondary" onclick="prevStep()">← Back</button>
          <button class="auth-btn auth-btn-primary"   onclick="nextStep()">Continue →</button>
        </div>
      </div>

      <!-- ---- STEP 3: Review ---- -->
      <div class="form-step" id="step3">
        <h1 class="auth-title">Look good?</h1>
        <p class="auth-subtitle">Review your details before creating your account</p>

        <div class="review-box" id="reviewBox">
          <!-- Populated by JS -->
        </div>

        <div class="auth-btn-row">
          <button class="auth-btn auth-btn-secondary" onclick="prevStep()">← Edit</button>
          <button class="auth-btn auth-btn-primary"   onclick="submitForm()">Create Account 🎉</button>
        </div>
      </div>

      <!-- Footer -->
      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('tasknest_logged_in')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
